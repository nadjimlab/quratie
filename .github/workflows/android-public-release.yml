name: Android Public Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      release_notes:
        description: "Public release notes"
        required: true
        default: "الإصدار التجريبي العام من تطبيق Qiraati 2026/2027"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    environment: qiraati-upload
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qiraati-upload.jks"
          chmod 600 "$RUNNER_TEMP/qiraati-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/qiraati-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_TYPE: PKCS12
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify application ID and APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'AndroidManifest.xml'
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Prepare public release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ inputs.release_notes || 'إصدار عام من تطبيق Qiraati 2026/2027' }}
        run: |
          test -n "$RELEASE_TAG"
          case "$RELEASE_TAG" in v*) ;; *) echo "Tag must start with v"; exit 1;; esac
          VERSION_NAME="${RELEASE_TAG#v}"
          cat > update.json <<EOF
          {
            "versionCode": 1,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-release.apk",
            "releaseNotes": "$RELEASE_NOTES",
            "mandatory": false
          }
          EOF
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app-release.apk.sha256 \
            update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qiraati $RELEASE_TAG" \
            --notes-file release-notes.txt \
            --latest
